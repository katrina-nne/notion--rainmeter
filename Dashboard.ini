[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1

@include1=@Resources\Variables.inc
@include2=@Resources\Data\dashboard_variables.inc


[Background]
Meter=Shape

Shape=Rectangle 0,0,#DashboardWidth#,560,22 | Fill Color #Background#

[Greeting]
Meter=String

Text=#Greeting#

FontFace=Yu Gothic UI Semibold
FontSize=18
FontWeight=700

FontColor=255,255,255

AntiAlias=1

StringEffect=Shadow
FontEffectColor=0,0,0,120

X=28
Y=34

[Today]
Meter=String

Text=#Today#

FontFace=Yu Gothic UI
FontSize=12

FontColor=180,180,180

AntiAlias=1

X=30
Y=72

[Summary]
Meter=String

Text=#Summary#

FontFace=Yu Gothic UI
FontSize=12
FontWeight=600

FontColor=90,170,255

AntiAlias=1

X=30
Y=94


[Card1BG]
Meter=Shape

Shape=Rectangle #DashboardPadding#,120,#CardWidth#,#CardHeight#,#CardRadius# | Fill Color #CardBackground#

[Card1Accent]

Meter=Shape

Shape=Rectangle #DashboardPadding#,120,5,#CardHeight#,#CardRadius# | Fill Color #Accent#


[Card1Title]
Meter=String

FontFace=#BodyFont#
FontSize=15

FontWeight=700

FontColor=#PrimaryText#

Text=#Card1Title#

X=44
Y=156


[Card1Course]
Meter=String

FontFace=#BodyFont#
FontSize=10

FontWeight=600

FontColor=#Card1Colour#

Text=#Card1Course#

X=44
Y=136

[Card1Footer]
Meter=String

FontFace=#BodyFont#
FontSize=10

FontColor=#SecondaryText#

Text=#Card1Due#   •   #Card1Time#

X=44
Y=186






