[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=35,35,40,220

[Metadata]
Name=Notion Dashboard
Author=ChatGPT
Version=1.0

[Variables]
JsonFile=#@#..\events.json

; ---------- Measure ----------
[MeasureJSON]
Measure=Plugin
Plugin=WebParser
URL=file://#CURRENTPATH#events.json
RegExp=(?siU).*"task":\s*"([^"]+)".*"class":\s*"([^"]+)".*"due":\s*"([^"]+)".*"time":\s*"([^"]+)"

; ---------- Title ----------
[Title]
Meter=String
Text=📚 Academic Dashboard
FontFace=Segoe UI Variable Display
FontSize=16
FontColor=255,255,255
AntiAlias=1
X=20
Y=20

; ---------- Task ----------
[Task]
Meter=String
MeasureName=MeasureJSON
StringIndex=1
FontFace=Segoe UI
FontSize=14
FontColor=255,255,255
X=20
Y=60

; ---------- Class ----------
[Class]
Meter=String
MeasureName=MeasureJSON
StringIndex=2
FontFace=Segoe UI
FontSize=12
FontColor=120,200,255
X=20
Y=90

; ---------- Due ----------
[Due]
Meter=String
MeasureName=MeasureJSON
StringIndex=3
FontFace=Segoe UI
FontSize=12
FontColor=200,200,200
X=20
Y=115

; ---------- Time ----------
[Time]
Meter=String
MeasureName=MeasureJSON
StringIndex=4
FontFace=Segoe UI
FontSize=12
FontColor=200,200,200
X=20
Y=140